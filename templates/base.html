<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Marshal{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="stylesheet" href="/static/css/index.css">
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar">
    {% for page in pages %}
      <a href="{{ page.url }}">{{ page.name }}</a>
    {% endfor %}
  </nav>
  <div class="page">
    {% block content %}{% endblock %}
    <footer>
      {% for page in pages %}
        <a href="{{ page.url }}">{{ page.name }}</a>
      {% endfor %}
    </footer>
  </div>
</body>
</html>
